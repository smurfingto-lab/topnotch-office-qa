name: Office Manager Windows Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TopNotch_Public_Safe_Windows_QA_Source/app/**'
      - 'TopNotch_Public_Safe_Windows_QA_Source/tests/**'
      - '.github/workflows/windows-acceptance.yml'
  pull_request:
    paths:
      - 'TopNotch_Public_Safe_Windows_QA_Source/app/**'
      - 'TopNotch_Public_Safe_Windows_QA_Source/tests/**'
      - '.github/workflows/windows-acceptance.yml'
permissions:
  contents: read
jobs:
  windows-acceptance:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: TopNotch_Public_Safe_Windows_QA_Source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: TopNotch_Public_Safe_Windows_QA_Source/app/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Windows executable
        shell: pwsh
        run: |
          Push-Location app
          go build -trimpath -o OfficeManager.exe main.go
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          Pop-Location
          $exe = Get-Item app/OfficeManager.exe
          if ($exe.Length -lt 100000) { throw 'Invalid executable size' }
          Get-FileHash app/OfficeManager.exe -Algorithm SHA256
      - name: Generate synthetic document fixtures (NOT production forms)
        shell: pwsh
        run: |
          python tests/make_test_templates.py
          if ($LASTEXITCODE -ne 0) { throw 'Test fixtures failed' }
      - name: Run 500 real Windows API workflows
        shell: pwsh
        run: |
          python tests/test_500_workflows.py
          if ($LASTEXITCODE -ne 0) { throw '500 workflow test failed' }
      - name: Install Chromium browser test dependency
        shell: pwsh
        run: |
          python -m pip install playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
      - name: Launch EXE and test live UI in Chromium
        shell: pwsh
        run: |
          python tests/test_windows_browser.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows browser UI test failed' }
      - name: Inspect Windows executable and browser evidence
        shell: pwsh
        if: always()
        run: |
          if (Test-Path app/OfficeManager.exe) { Get-FileHash app/OfficeManager.exe -Algorithm SHA256 }
          Get-ChildItem . -Filter 'windows-*.png' -ErrorAction SilentlyContinue | Select-Object Name,Length
      - name: Upload evidence (even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-manager-windows-qa-${{ github.run_number }}
          path: |
            TopNotch_Public_Safe_Windows_QA_Source/windows-*.png
            TopNotch_Public_Safe_Windows_QA_Source/app/OfficeManager.exe
          if-no-files-found: warn
          retention-days: 14
